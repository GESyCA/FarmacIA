<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BulaGraph - Visualizador do Grafo de Conhecimento</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Vis.js CDN -->
    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    
    <style>
        :root {
            --bg-main: #0b0f19;
            --bg-card: #151e33;
            --border-color: #263558;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --accent: #4f46e5;
            --accent-hover: #6366f1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        header {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            border-bottom: 1px solid var(--border-color);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-logo {
            width: 38px;
            height: 38px;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 20px;
            color: white;
            box-shadow: 0 0 15px rgba(139, 92, 246, 0.4);
        }

        .brand-text h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 0.5px;
            background: linear-gradient(to right, #3b82f6, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand-text p {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .control-group label {
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 500;
        }

        select, input {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px 12px;
            border-radius: 8px;
            font-family: inherit;
            font-size: 13px;
            outline: none;
            transition: all 0.2s;
            min-width: 180px;
        }

        select:focus, input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 8px rgba(79, 70, 229, 0.3);
        }

        .main-container {
            flex: 1;
            display: flex;
            position: relative;
            overflow: hidden;
        }

        .network-wrapper {
            flex: 1;
            position: relative;
            height: 100%;
            overflow: hidden;
            background-color: #0b0f19;
        }

        #mynetwork {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            right: 0;
        }


        /* Sidebar Details Panel */
        .details-panel {
            width: 400px;
            background-color: var(--bg-card);
            border-left: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
            box-shadow: -4px 0 20px rgba(0,0,0,0.2);
            z-index: 5;
        }

        .details-header {
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(15, 23, 42, 0.3);
        }

        .details-header h2 {
            font-family: 'Outfit', sans-serif;
            font-size: 18px;
            font-weight: 600;
        }

        .details-content {
            padding: 20px;
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            font-size: 14px;
            line-height: 1.6;
        }

        .placeholder-text {
            color: var(--text-muted);
            text-align: center;
            margin-top: 50px;
            font-style: italic;
        }

        .detail-item {
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 10px;
            padding: 15px;
        }

        .detail-item-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-muted);
            margin-bottom: 4px;
            font-weight: 600;
        }

        .detail-item-value {
            font-weight: 500;
            color: var(--text-main);
            word-break: break-word;
        }

        .badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            margin-top: 4px;
        }

        /* Legend Panel */
        .legend {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(21, 30, 51, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 15px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px 15px;
            max-width: 350px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            pointer-events: none;
            z-index: 4;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 11px;
            color: var(--text-main);
        }

        .legend-color {
            width: 12px;
            height: 12px;
            border-radius: 3px;
        }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <div class="brand-logo">B</div>
            <div class="brand-text">
                <h1>BulaGraph Visualizer</h1>
                <p>Grafo de Conhecimento RAG de Bulas - FarmacIA</p>
            </div>
        </div>
        
        <div class="controls">
            <div class="control-group">
                <label for="medication-filter">Medicamento</label>
                <select id="medication-filter">
                    <option value="ALL">Todos os Medicamentos</option>
                    <option value="AMOXIL">AMOXIL</option><option value="RIVOTRIL">RIVOTRIL</option><option value="TYLENOL">TYLENOL</option>
                </select>
            </div>
            
            <div class="control-group">
                <label for="search-input">Buscar Entidade</label>
                <input type="text" id="search-input" placeholder="Digite um termo...">
            </div>
        </div>
    </header>

    <div class="main-container">
        <!-- Legend Panel -->
        <div class="legend" id="legend-panel"></div>
        
        <!-- Graph Area Wrapper -->
        <div class="network-wrapper">
            <div id="mynetwork"></div>
        </div>

        
        <!-- Right Details Sidebar -->
        <div class="details-panel" id="details-panel">
            <div class="details-header">
                <h2>Detalhes do Nó</h2>
            </div>
            <div class="details-content" id="details-content">
                <p class="placeholder-text">Selecione um nó no grafo para ver os detalhes da entidade e o conteúdo factual correspondente.</p>
            </div>
        </div>
    </div>

                            } else if (key === 'text_preview') {
                                if (!full.metadata.text) {
                                    metaHtml += `
                                        <div class="detail-item">
                                            <div class="detail-item-label">Prévia do Conteúdo</div>
                                            <div class="detail-item-value" style="font-style: italic;">"${val}..."</div>
                                        </div>
                                    `;
                                }
                            } else {
                                metaHtml += `
                                    <div class="detail-item">
                                        <div class="detail-item-label">${key}</div>
                                        <div class="detail-item-value">${JSON.stringify(val)}</div>
                                    </div>
                                `;
                            }
                        }
                        
                        if (metaHtml) {
                            html += `
                                <h3 style="font-size: 12px; text-transform: uppercase; color: var(--text-muted); margin-top: 10px;">Metadados / Conteúdo</h3>
                                ${metaHtml}
                            `;
                        }
                    }
                    
                    detailsContent.innerHTML = html;
                }
            } else {
                detailsContent.innerHTML = `
                    <p class="placeholder-text">Selecione um nó no grafo para ver os detalhes da entidade e o conteúdo factual correspondente.</p>
                `;
            }
        });

        // Filters binding
        document.getElementById('medication-filter').addEventListener('change', applyFilters);
        document.getElementById('search-input').addEventListener('input', applyFilters);

        // Initial population
        applyFilters();

        function applyFilters() {
            const medFilter = document.getElementById('medication-filter').value;
            const searchFilter = document.getElementById('search-input').value.toLowerCase();
            
            // Filter nodes
            let filteredNodes = rawNodes;
            if (medFilter !== 'ALL') {
                filteredNodes = filteredNodes.filter(n => n.medications.includes(medFilter));
            }
            if (searchFilter) {
                filteredNodes = filteredNodes.filter(n => 
                    n.label.toLowerCase().includes(searchFilter) || 
                    n.group.toLowerCase().includes(searchFilter) ||
                    (n.full_data.aliases && n.full_data.aliases.some(a => a.toLowerCase().includes(searchFilter)))
                );
            }
            
            const activeNodeIds = new Set(filteredNodes.map(n => n.id));
            
            // Filter edges
            const filteredEdges = rawEdges.filter(e => 
                activeNodeIds.has(e.from) && activeNodeIds.has(e.to)
            );
            
            // Update datasets
            nodesDataSet.clear();
            nodesDataSet.add(filteredNodes);
            
            edgesDataSet.clear();
            edgesDataSet.add(filteredEdges);
            
            if (network) {
                network.stabilize();
            }
        }
    </script>
</body>
</html>
