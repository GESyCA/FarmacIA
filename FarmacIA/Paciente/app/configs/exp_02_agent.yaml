experiment_name: "gemini_agent_experiment"
pipeline_type: "agentic_rag"

run_flags:
  generate_vector_db: false
  run_retrieval: true
  run_generation: true
  run_evaluation: true

models:
  embedding_model: "sentence-transformers/all-MiniLM-L6-v2"
  generation_llm: "gemma-4-26b-a4b-it"
  judge_llm: "gemini-3.1-flash-lite"

datasets:
  - "dataset/dificeis_revisadas.csv"

metrics:
  section_retrieval:
    - "precision"
    - "recall"
    - "f1_score"
  information_retrieval:
    metrics_list:
      - "recall_at_k"
      - "precision_at_k"
      - "mrr"
      - "ndcg"
    k_value: 5
  generation:
    - "bleu"
    - "rouge"
    - "bertscore"
    - "cosine_similarity"
  llm_as_a_judge:
    - "faithfulness"
    - "answer_relevance"
    - "context_precision"
    - "context_recall"
