experiment_name: "gemini_hybrid_bge_m3"
pipeline_type: "hybrid_agentic_rag"

run_flags:
  generate_vector_db: true   # Indexa os PDFs com BGE-M3 na coleção 'bulas_bge_m3'
  run_retrieval: true
  run_generation: true
  run_evaluation: true

# Coleção ChromaDB separada para evitar misturar vetores de modelos diferentes
chroma_collection: "bulas_bge_m3"
chroma_path: "./chroma_bulas"

models:
  embedding_model: "BAAI/bge-m3"
  generation_llm: "gemma-4-26b-a4b-it"
  judge_llm: "gemini-3.1-flash-lite"

datasets:
  - "dataset/perguntas_respostas_dificeis.csv"

hybrid_retrieval:
  context_size_limit: 12000
  fallback_k: 15

# Limiar de similaridade para a fase de retrieval.
# null = desabilitado (comportamento padrão com k fixo).
# Ative trocando null por um float, ex: 0.45
# min_chunks garante ao menos N chunks mesmo se nenhum atingir o limiar.
retrieval:
  similarity_threshold: null
  min_chunks: 2

metrics:
  section_retrieval:
    - "precision"
    - "recall"
    - "f1_score"
  generation:
    - "bleu"
    - "rouge"
    - "bertscore"
  corpus_coverage: true
